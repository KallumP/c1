# c1 settings (example)
#
# Copy this file to settings.cfg and edit the copy to change the settings.
# settings.cfg is ignored by git, so your settings stay local. Without a
# settings.cfg the game uses the values below, which are built into the game.
#
# Each line sets one setting:
#
#   name = value
#
# A setting left out of the file keeps its default. Lines starting with # are
# ignored, and invalid lines are skipped with a warning in the console.
# Changes take effect the next time the game starts.

# Show each level's loading screen: on or off.
loading_screen = on

# Keep the loading screen up for at least this many milliseconds, since levels
# load from disk much faster than from the PS1 CD. 0 shows it only for as long
# as loading takes. Up to 60000.
loading_screen_min_ms = 2000

# Show how fast Crash is moving in the top right corner: on or off. The first
# line is the horizontal speed, then the signed speed along the x, y (up) and
# z axes. They're in the game's own speed units per second, and read 0 when
# Crash is standing still or pushing against a wall.
speed_display = off

# Skip the Sony, Universal and Naughty Dog screens when the game starts and
# go straight to the main menu: on or off.
skip_splash_screens = off

# Draw 3D models (Crash, crates, enemies) in front of or behind each other by
# their actual depth, so a model behind another can't be drawn over it: on or
# off. This goes beyond the original game, whose draw order sometimes draws one
# model over another in front of it (e.g. a crate over Crash); off keeps that.
model_depth_buffer = off
