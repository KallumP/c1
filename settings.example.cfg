# c1 settings (example)
#
# Copy this file to settings.cfg and edit the copy to change the settings.
# settings.cfg is ignored by git, so your settings stay local. Without a
# settings.cfg the game uses the values below, which are built into the game.
#
# Each line sets one setting:
#
#   name = value
#
# A setting left out of the file keeps its default. Lines starting with # are
# ignored, and invalid lines are skipped with a warning in the console.
# Changes take effect the next time the game starts.

# Show each level's loading screen: on or off.
loading_screen = on

# Keep the loading screen up for at least this many milliseconds, since levels
# load from disk much faster than from the PS1 CD. 0 shows it only for as long
# as loading takes. Up to 60000.
loading_screen_min_ms = 2000
