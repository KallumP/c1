# c1 settings (example)
#
# Copy this file to settings.cfg and edit the copy to change the settings.
# The values below are the defaults. See doc/settings.md for what each
# setting does and the values it takes.

loading_screen = on
loading_screen_min_ms = 2000
speed_display = off
skip_splash_screens = off
fix_model_draw_order = off
replay_inputs = off
replay_speed = 1

